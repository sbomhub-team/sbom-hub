apiVersion: v1
kind: Namespace
metadata:
  name: sbom

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbom-frontend
  namespace: sbom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sbom-frontend
  template:
    metadata:
      labels:
        app: sbom-frontend
    spec:
      containers:
      - name: sbom-frontend
        image: sbom-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: sbom-frontend
  namespace: sbom
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: sbom-frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sbom-frontend-hpa
  namespace: sbom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sbom-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
