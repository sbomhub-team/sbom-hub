apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbom-backend
  namespace: sbom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sbom-backend
  template:
    metadata:
      labels:
        app: sbom-backend
    spec:
      serviceAccountName: sbom-backend
      containers:
        - name: sbom-backend
          image: sbomhub/sbom-backend:v13
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: USE_K8S
              value: "true"
            - name: K8S_NAMESPACE
              value: "sbom"
            - name: SCANNER_IMAGE
              value: "sbomhub/sbom-scanner:v1"
            - name: WORKSPACE_PVC_NAME
              value: "sbom-workspace-pvc"
            - name: SBOM_WORKSPACE_DIR
              value: "/workspace-data/jobs"
            - name: FRONTEND_URL
              value: "https://sbom-hub.com"
            - name: MONGO_URL
              value: "mongodb://sbom-mongo:27017/sbom"
            - name: MAX_UPLOAD_MB
              value: "200"
          volumeMounts:
            - name: sbom-workspace
              mountPath: /workspace-data
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: sbom-workspace
          persistentVolumeClaim:
            claimName: sbom-workspace-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: sbom-backend
  namespace: sbom
spec:
  selector:
    app: sbom-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
