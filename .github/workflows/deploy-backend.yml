name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - sbom-backend/**
      - k8s/04-backend.yaml
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE_NAME: sbomhub/sbom-backend
      DEPLOYMENT_NAME: sbom-backend
      K8S_NAMESPACE: sbom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse SECRET bundle
        run: |
          SECRET_BUNDLE=$(cat <<'EOF'
          ${{ secrets.SECRET }}
          EOF
          )

          missing=""

          get_kv() {
            printf '%s\n' "$SECRET_BUNDLE" | sed -n "s/^$1=//p" | head -n 1
          }

          DOCKERHUB_USERNAME="$(get_kv DOCKERHUB_USERNAME)"
          DOCKERHUB_TOKEN="$(get_kv DOCKERHUB_TOKEN)"
          SSH_HOST="$(get_kv SSH_HOST)"
          SSH_USER="$(get_kv SSH_USER)"
          SSH_PORT="$(get_kv SSH_PORT)"

          SSH_PRIVATE_KEY="$({
            printf '%s\n' "$SECRET_BUNDLE" | awk '
              BEGIN {capture=0; delim=""}
              /^SSH_PRIVATE_KEY<</ {delim=substr($0, index($0, "<<") + 2); capture=1; next}
              capture && $0 == delim {capture=0; exit}
              capture {print}
            '
          })"

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            SSH_PRIVATE_KEY_ESCAPED="$(get_kv SSH_PRIVATE_KEY)"
            if [ -n "$SSH_PRIVATE_KEY_ESCAPED" ]; then
              SSH_PRIVATE_KEY="$(printf '%b' "$SSH_PRIVATE_KEY_ESCAPED")"
            fi
          fi

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            missing="$missing DOCKERHUB_USERNAME"
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            missing="$missing DOCKERHUB_TOKEN"
          fi
          if [ -z "$SSH_HOST" ]; then
            missing="$missing SSH_HOST"
          fi
          if [ -z "$SSH_USER" ]; then
            missing="$missing SSH_USER"
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            missing="$missing SSH_PRIVATE_KEY"
          fi

          if [ -n "$missing" ]; then
            echo "Missing required values in SECRET:$missing"
            exit 1
          fi

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "DOCKERHUB_TOKEN=$DOCKERHUB_TOKEN"
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_USER=$SSH_USER"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_PRIVATE_KEY<<KEY_EOF"
            echo "$SSH_PRIVATE_KEY"
            echo "KEY_EOF"
          } >> "$GITHUB_ENV"

          echo "SECRET parsed successfully"

      - name: Set short SHA tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./sbom-backend
          file: ./sbom-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.DEPLOYMENT_NAME }}=${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} -n ${{ env.K8S_NAMESPACE }}
            kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} --timeout=240s
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }} -o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[0].image,READY:.status.containerStatuses[0].ready
